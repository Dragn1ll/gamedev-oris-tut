<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>@Model.Title</title>
</head>
<body>
    <h1>@Model.Title</h1>
    @if (Model.IsEmpty) {
        <p>Задач пока нет</p>
    }
    <ul>
        @foreach (var task in Model.Tasks) {
            <li>@if (task.IsCompleted) {<s>@task.Title</s>}@if (task.IsPending) {@task.Title}</li>
        }
    </ul>
</body>
</html>
